services:
  postgres:
    image: postgres:18-alpine # Alpine for lighter images
    container_name: odyssey-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - database-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis:7-alpine
    container_name: odyssey-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redisdata:/data
    networks:
      - cache-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odyssey-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      APP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_CONNECT_TIMEOUT: 5s
      DB_PING_TIMEOUT: 3s
      DB_MAX_CONNS: "20"
      DB_MIN_CONNS: "5"
      DB_MAX_CONN_LIFETIME: 30m
      DB_MAX_CONN_IDLE_TIME: 5m
      DB_HEALTH_CHECK_PERIOD: 1m
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRATION: 5m
    networks:
      - database-net
      - cache-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:  
  pgdata:
  redisdata:

networks:
  database-net:
    driver: bridge
  cache-net:
    driver: bridge
